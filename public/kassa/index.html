<!doctype html>
<html lang="ka" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Room</title>
<link rel="manifest" href="/manifest.webmanifest?v=2">
<meta name="theme-color" content="#2A1D13">
<link rel="icon" href="/icon-v2-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Georgian:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3CDA8;--paper:#F4ECDD;--card:#FBF5EA;--white:#fff;--ink:#2A1D13;--muted:#5C4632;--line:#D9C4A2;--y:#FDC134;--red:#C8361F;--redink:#8A2414;--green:#2F6B3A;--greenbg:#DDE7D2;--warn:#8A4A00;--warnbg:#FFF1C9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans Georgian",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--ink)}
.f{height:44px;border-radius:12px;border:1px solid #CDB58F;background:#fff;padding:0 12px;font-weight:600;width:100%}
.f:focus{outline:3px solid rgba(253,193,52,.6);border-color:var(--ink)}
.b{height:44px;padding:0 16px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.by{background:var(--y);color:var(--ink)}.bd{background:var(--ink);color:var(--card)}.bo{box-shadow:inset 0 0 0 1px var(--ink)}.bw{background:#fff}.br{background:var(--red);color:#fff}.bg{background:var(--green);color:#fff}
.sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.top{height:58px;background:var(--ink);color:var(--card);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:5}
.top .tl{display:flex;align-items:center;gap:10px;justify-self:start}.top .tr{display:flex;align-items:center;gap:8px;justify-self:end;flex-wrap:nowrap}
.top .tlang{background:#3a2d22;border-radius:10px;padding:3px;display:flex;gap:2px}.top .tlang button{height:32px;min-width:40px;padding:0 8px;border-radius:8px;font-weight:800;font-size:13px;color:#E8DCC8}.top .tlang button.on{background:var(--y);color:var(--ink)}
.top .tlogo{height:44px;display:block;justify-self:center}
@media (max-width:820px){.top{grid-template-columns:auto auto 1fr}.top .tlogo{height:34px}}
@media (display-mode: window-controls-overlay){.top{-webkit-app-region:drag;app-region:drag;padding-left:max(14px, env(titlebar-area-x, 0px));padding-right:calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 10px)}.top button,.top a,.top .badge{-webkit-app-region:no-drag;app-region:no-drag}}
.top img{height:42px;display:block}
.top .who{font-size:13px;color:#E8DCC8}
.top .sp{flex:1}
.tb{height:38px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13px;color:var(--card);box-shadow:inset 0 0 0 1px #57534E}
.tb.on{background:var(--y);color:var(--ink);box-shadow:none}
.badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
.pos{display:grid;grid-template-columns:minmax(190px,250px) minmax(0,1fr) minmax(310px,380px);height:calc(100vh - 58px);overflow:hidden}
.pos .col{scrollbar-width:thin;scrollbar-color:#c9b48a transparent}.pos .col::-webkit-scrollbar{width:6px}.pos .col::-webkit-scrollbar-thumb{background:#c9b48a;border-radius:6px}.pos .col::-webkit-scrollbar-button{display:none;height:0;width:0}
.col{min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:12px;display:flex;flex-direction:column;gap:10px}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line);background:#fff}
h2{margin:0;font-size:15px;font-weight:800}
.oc{background:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.oc.sel{box-shadow:inset 0 0 0 2px var(--ink)}.oc.new{box-shadow:inset 0 0 0 2px var(--y)}
.chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;display:inline-block}
.ch-hall,.ch-takeaway,.ch-delivery{background:#E8DCC8}.ch-site{background:var(--y)}.ch-wolt{background:#2a78d6;color:#fff}.ch-glovo{background:#1baf7a;color:#fff}.ch-bolt{background:#34D186;color:#0b3}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.mut{color:var(--muted);font-size:12px}
.chans{display:flex;gap:6px;flex-wrap:wrap}
.chans button{flex:1;min-width:70px;height:clamp(38px,5.5vh,48px);border-radius:12px;background:#fff;font-weight:800;font-size:15px}
.chans button.on{background:var(--ink);color:var(--card)}
.cats{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cats button{height:clamp(32px,4.6vh,40px);padding:0 13px;border-radius:999px;background:#fff;font-weight:800;font-size:14px}
.cats button.on{background:var(--ink);color:var(--card)}
.search{flex:1;min-width:180px;max-width:320px;height:38px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;font-weight:600;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(108px,8.6vw,160px),1fr));gap:8px;align-content:start}
.grid.fit .pc{height:100%;min-height:0}.grid.fit .pc img{flex:1 1 0;min-height:0;height:auto;width:100%;object-fit:cover;display:block}.grid.fit .pc.tall img{object-fit:contain;padding:4px 0}.grid.fit .pc .n{min-height:0;font-size:var(--fs,13px);line-height:1.2;height:calc(var(--fs,13px) * 2.4 + 4px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:4px 7px 0;flex:none;box-sizing:border-box}.grid.fit .pc .p{font-size:calc(var(--fs,13px) + 2px);padding:1px 7px 5px;flex:none}
.pc{background:#fff;border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative}
.pc img{width:100%;height:clamp(64px,10vh,100px);object-fit:cover;display:block;background:#2B2622}
.pc .n{padding:6px 9px 0;font-weight:700;font-size:clamp(12px,1.6vh,14px);line-height:1.2;min-height:30px;overflow-wrap:anywhere}
.pc .p{padding:2px 9px 7px;font-weight:900;font-size:clamp(14px,2vh,17px)}
.pc.stop{opacity:.45}.pc.stop::after{content:"სტოპი";position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.stopmode .pc{outline:2px dashed var(--red)}
.ln>*{min-width:0;overflow-wrap:anywhere}.ln{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--paper)}
.qty{display:flex;align-items:center;background:#fff;border-radius:10px}
.qty button{width:38px;height:38px;font-weight:800;font-size:18px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot b{font-size:30px;font-weight:900}
.pay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.pay>*{min-width:0}
.pay .b{min-height:52px;height:auto;padding:6px 8px;font-size:15px;white-space:normal;line-height:1.15}
.modal{position:fixed;inset:0;background:rgba(42,29,19,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--card);border-radius:22px;padding:20px;width:min(440px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox.wide{width:min(980px,100%)}
.mbox h3{margin:0;font-size:20px;font-weight:900}
.schtab{border-collapse:collapse;font-size:13px}.schtab th,.schtab td{border:1px solid #EFE5D3;padding:4px 3px}.schtab td.sch{width:30px;min-width:30px;height:34px;text-align:center;font-weight:800;cursor:pointer;user-select:none}.schtab td.sch:hover{outline:2px solid var(--gold,#FDC134);outline-offset:-2px}
.schtab th.sch-h{text-align:center;font-size:12px;cursor:pointer;min-width:30px}.schtab th.sch-h span{font-weight:500;color:#7A6450}.schtab .sch-we{background:#FBF5EA}.schtab .sch-today{box-shadow:inset 0 0 0 2px #FDC134}
.advb{background:#C0392B;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:6px}
.advcard{border-left:5px solid #2F6B3A}.adv-expired{border-left-color:#C0392B}.adv-expiry{border-left-color:#E8A33D}.adv-day{border-left-color:#1D4E89}.adv-slow{border-left-color:#8E5CC2}.adv-info{border-left-color:#999}.adv-holiday{border-left-color:#D4A017}.adv-pnl{border-left-color:#5C4632}
.advbars{display:flex;gap:10px;align-items:flex-end;height:150px;padding:6px 0}.advbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;font-size:12px}.advcol{flex:1;width:100%;max-width:56px;display:flex;align-items:flex-end}.advcol>div{width:100%;border-radius:4px 4px 0 0}
.sgh{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#F2C14E;padding:14px 14px 6px;margin-top:8px;border-top:1px solid rgba(255,255,255,.14)}.sgh:first-child{padding-top:2px;margin-top:0;border-top:0}
.subnav{align-self:flex-start;flex-wrap:wrap}
@media (max-width:820px){.sgh{display:none}}
.savebar{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--card);border-radius:16px;padding:10px 12px 10px 18px;box-shadow:0 -6px 20px rgba(42,29,19,.18);font-size:14px}.savebar.dirty{background:#8A2414}
.xbar{display:flex;gap:8px;justify-content:flex-end;margin:-6px 0 -8px}
@media print{body.printadm *{visibility:visible!important}body.printadm #print,body.printadm .top,body.printadm .side,body.printadm .xbar,body.printadm .tstop,body.printadm .modal,body.printadm button,body.printadm .toast{display:none!important}
 body.printadm{background:#fff}body.printadm .adm{display:block;height:auto}body.printadm .main{overflow:visible;padding:0;gap:10px;position:static;width:auto}body.printadm .tscroll{overflow:visible!important;max-height:none!important}
 body.printadm .card{break-inside:avoid-page;border:1px solid #ddd;box-shadow:none}body.printadm table{font-size:10px}body.printadm .schtab td.sch{width:20px;min-width:20px;height:22px}body.printadm *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.armed{background:#C0392B!important;color:#fff!important;border-color:#C0392B!important;animation:arm .5s ease 2}@keyframes arm{50%{transform:scale(1.04)}}
.plink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.plink:hover{color:var(--redink)}
.mbox>.row:last-child{flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--card);padding:12px 0 6px;margin-bottom:-6px;z-index:3;box-shadow:0 -10px 12px -12px rgba(42,29,19,.45)}
.pin{height:52px;border-radius:12px;background:#fff;border:1px solid #CDB58F;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border-radius:12px;background:#fff;font-size:22px;font-weight:800}
.err{background:#FCE3DE;color:var(--redink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.ok{background:var(--greenbg);color:#22562E;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:999px;font-weight:700;z-index:80;max-width:92vw}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.login .mbox{width:min(380px,100%)}
/* admin */
.adm{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 58px)}
.side{background:var(--ink);color:var(--card);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side button{min-height:42px;border-radius:12px;text-align:left;padding:0 12px;font-weight:800;font-size:16px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}.side button .si{width:24px;text-align:center;font-size:18px}.side button:hover:not(.on){background:rgba(255,255,255,.08)}
.side button.on{background:var(--y);color:var(--ink)}
.side .seg button{color:var(--ink)}.side .seg button.on{color:var(--card)}
.main{overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px}
.main h1{margin:0;font-size:28px;font-weight:900}
.card{background:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border-radius:16px;padding:14px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-size:24px;font-weight:900;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13px}

.tstop{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:2px}.tstop::-webkit-scrollbar{height:12px}.tstop::-webkit-scrollbar-thumb{background:#c9b48a;border-radius:8px}.tstop::-webkit-scrollbar-track{background:#f3ece0;border-radius:8px}
.tscroll{overflow:auto;max-height:calc(100vh - 170px);overscroll-behavior:contain;border-radius:10px}
.tscroll th{position:sticky;top:0;background:#fff;z-index:2;box-shadow:0 1px 0 var(--line)}
.tscroll tr>td:first-child,.tscroll tr>th:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}
.tscroll tr>th:first-child{z-index:3}
.tscroll::-webkit-scrollbar{height:12px;width:10px}.tscroll::-webkit-scrollbar-thumb{background:#c9b48a;border-radius:8px}.tscroll::-webkit-scrollbar-track{background:#f3ece0}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th.s{cursor:pointer}
td{padding:8px;border-bottom:1px solid #F0E6D6;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.low td{background:#FFF4F1}
.abar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 2px}.abar .mpick .mpb{min-width:0;height:38px;font-size:14px}
.mpick{position:relative;display:inline-flex;gap:6px;align-items:center}.mpick>.b{height:42px;min-width:42px;font-size:18px;padding:0 12px}.mpick .mpb{font-size:16px;font-weight:800;min-width:190px}.mpick .b:disabled{opacity:.35}
.mpop{position:absolute;top:48px;right:0;z-index:50;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:12px;width:330px}.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mgrid button{height:40px;border-radius:10px;font-weight:700;font-size:14px;background:#F4F1EA}.mgrid button.now{outline:2px solid #FFC244}.mgrid button.on{background:#1E1E1E;color:#fff}.mgrid button:disabled{opacity:.3}
@keyframes blink{50%{opacity:.25}}.side button.alarm{background:#8A2414!important;color:#fff!important}.side button.alarm .si{animation:blink 1s steps(2) infinite}.blinkdot{width:10px;height:10px;border-radius:50%;background:#FF4D3A;margin-left:auto;animation:blink 1s steps(2) infinite}
.seg{display:inline-flex;background:#fff;border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 12px;border-radius:9px;font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:var(--card)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.g2>*{min-width:0}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label.l{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pos-pill{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px}
.good{background:var(--greenbg);color:#22562E}.bad{background:#FCE3DE;color:var(--redink)}.mid{background:var(--warnbg);color:var(--warn)}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:72mm}}
#print{display:none}
@media print{#print{display:block}}
.rc{width:300px;background:#fff;padding:18px;font-family:"Courier New",monospace,"Noto Sans Georgian";font-size:12px;line-height:1.55;color:#111}
.rc img{height:64px;display:block;margin:0 auto 6px;filter:grayscale(1) contrast(1.4)}
.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between;gap:8px}

.neg{color:var(--redink)}
td.n{white-space:nowrap}

tr.ptot td{font-weight:900;background:#F4EAD6}

/* ── телефон: админка с телефона ── */
@media (max-width:820px){
  .top{height:auto;min-height:52px;flex-wrap:wrap;padding:6px 10px;gap:6px}
  .top img{height:34px}.top .who{font-size:11px;max-width:120px;line-height:1.2}
  .tb{height:34px;padding:0 9px;font-size:12px}
  .adm{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - 52px)}
  .side{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;gap:6px;position:sticky;top:0;z-index:4;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side button{flex:0 0 auto;height:38px;white-space:nowrap;font-size:13px;padding:0 12px}
  .side .seg{margin-top:0!important;flex:0 0 auto}
  .main{overflow:visible;padding:14px 12px;gap:12px}
  .main h1{font-size:24px}
  .main .row.between{flex-wrap:wrap;gap:8px}
  .main table{font-size:12px}
  .card{overflow-x:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:20px}
  .g3{grid-template-columns:1fr!important}
  .mbox{max-width:calc(100vw - 20px)!important;max-height:90vh;overflow:auto}
  .mbox>.row:last-child>.b{flex:1 1 40%!important;min-width:0}
  .mbox>.row:last-child>label{flex:1 1 100%}
}


/* телефон (iPhone): шапка в две строки, ничего не вылезает за правый край */
@media (max-width:600px){
  html,body{max-width:100%;height:auto;min-height:100%;overflow-x:clip}
  .top{display:flex!important;flex-wrap:wrap;justify-content:space-between;height:auto;padding:max(6px, env(safe-area-inset-top)) 8px 6px;gap:6px}
  .top .tl{flex:0 0 auto}.top .tlogo{display:none!important}
  .top .tr{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start;gap:6px}
  .top .tr .tb{flex:1 1 0;min-width:0;padding:0 6px}
  .top .tlang button{min-width:34px;height:30px;padding:0 6px}
  .adm,.main{min-width:0;max-width:100vw}
  .main>*{min-width:0;max-width:100%}
  .xbar{justify-content:flex-start;flex-wrap:wrap;margin:0}
  .toast{left:8px!important;right:8px!important;transform:none!important;max-width:none!important;font-size:15px!important}
}

.mburg,.mshade{display:none}
@media (max-width:600px){
  .mburg{display:inline-flex;align-items:center;justify-content:center;width:40px;height:36px;border-radius:10px;font-size:22px;color:var(--card);box-shadow:inset 0 0 0 1px #57534E;margin-right:4px}
  .adm .side{position:fixed!important;top:0;left:0;bottom:0;width:min(82vw,300px);z-index:60;flex-direction:column!important;overflow-y:auto!important;overflow-x:hidden!important;padding:max(14px, env(safe-area-inset-top)) 10px 20px!important;gap:4px!important;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  .adm .side button{width:100%;height:44px!important;font-size:15px!important;justify-content:flex-start}
  .adm .side .seg{margin-top:10px!important}
  .adm.mopen .side{transform:none}
  .adm.mopen .mshade{display:block;position:fixed;inset:0;z-index:59;background:rgba(20,14,9,.45)}
}

@media (max-width:600px){

    return new Promise((resolve, reject) => {
      S.modal = { type: 'approve', title, pin: '', err: e.code === 'approval_failed' ? ERR_KA.approval_failed : '', resolve, reject, fn }; render();
    });
  });
}
async function approveSubmit() {
  const m = S.modal; const pin = m.pin; m.pin = '';

  render();
}

async function plFileUp(id) {

async function plFileGet(id) {
  const f = await api('GET', '/api/settlements/' + id + '/file'); const bin = atob(f.b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u], { type: f.mime })); const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);

/* ───────── отрисовка и события ───────── */
/* широкие таблицы: своя прокрутка в пределах экрана — полоса прокрутки всегда видна, шапка и первый столбец на месте */
// ───────── выгрузка в Excel (.xlsx без библиотек) и печать / PDF ─────────
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u) => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files) { const enc = new TextEncoder(); const parts = []; const cen = []; let off = 0;
  for (const [name, text] of files) { const nb = enc.encode(name); const data = enc.encode(text); const crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nb); off += 30 + nb.length + data.length; }

          if (!confirm(L(`Нет у поставщика: ${nm}?\n\nВременно перестанут продаваться (${live.length}):\n${live.map((u) => '• ' + u.name_ru).join('\n') || '—'}\n\nКогда поставка придёт — нажмите «Поставка пришла» или просто проведите приход: всё вернётся само.`, `${nm} — მომწოდებელთან არ არის?\n\nდროებით აღარ გაიყიდება (${live.length}):\n${live.map((u) => '• ' + (u.name_ka || u.name_ru)).join('\n') || '—'}`))) return; }
        const r = await api('POST', `/api/ingredients/${i.id}/out`, { out }); S.A.cat = await api('GET', '/api/catalog');
        toast(out ? L('Остановлено: ', 'შეჩერდა: ') + (r.stopped || []).length + L(' поз. — на сайте «Временно нет»', ' პოზ. — საიტზე „დროებით არ არის“') : L('Вернулись в продажу: ', 'გაყიდვაში დაბრუნდა: ') + (r.resumed || []).length); }); }
    case 'dpOff': S.modal = { type: 'form', html: () => `<h3>🛵 ${L('Доставка на паузу', 'მიტანის შეჩერება')}</h3>
      <label class="l">${L('Причина — клиенты увидят её на сайте', 'მიზეზი — კლიენტები საიტზე დაინახავენ')}<select class="f" id="dp_r">${Object.entries(DPR()).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="l">${L('Свой текст (для «другое»), можно на любом языке', 'საკუთარი ტექსტი („სხვა“-სთვის)')}<input class="f" id="dp_n" maxlength="140" placeholder="${L('Например: технический перерыв до вечера', 'მაგ.: ტექნიკური შესვენება საღამომდე')}"></label>
      <label class="l">${L('Когда включить доставку обратно', 'როდის ჩავრთოთ მიტანა')}<select class="f" id="dp_u"><option value="">${L('Вручную — когда нажму «Включить»', 'ხელით — როცა დავაჭერ „ჩართვას“')}</option><option value="60">${L('Через 1 час', '1 საათში')}</option><option value="120">${L('Через 2 часа', '2 საათში')}</option><option value="180">${L('Через 3 часа', '3 საათში')}</option><option value="eod">${L('До конца дня (завтра снова работает)', 'დღის ბოლომდე (ხვალ ისევ მუშაობს)')}</option><option value="t">${L('В указанное время ↓', 'მითითებულ დროს ↓')}</option></select></label>
      <label class="l">${L('Время (если выбрали «в указанное время»)', 'დრო')}<input class="f" id="dp_t" type="time" value="18:00"></label>
      <div class="note">${L('На сайте сразу появится объявление: «Доставка временно на паузе — самовывоз из Batumi Mall работает». Кнопка «Доставка» станет недоступной.', 'საიტზე მაშინვე გამოჩნდება: „მიტანა დროებით შეჩერებულია — გატანა მუშაობს“.')}</div>
      <div class="row"><button class="b bo" style="flex:1" data-a="mClose">${L('Отмена', 'გაუქმება')}</button><button class="b bd" style="flex:1" data-a="dpGo">⏸ ${L('Поставить на паузу', 'შეჩერება')}</button></div>` }; return render();
    case 'dpGo': { const u = val('dp_u'); let until = null; const now = Date.now();
      if (u === '60' || u === '120' || u === '180') until = new Date(now + Number(u) * 60e3).toISOString();
      if (u === 'eod' || u === 't') { const tb = new Date(now + 4 * 3600e3); const [hh, mm] = (u === 'eod' ? '23:59' : (val('dp_t') || '18:00')).split(':').map(Number); let t = Date.UTC(tb.getUTCFullYear(), tb.getUTCMonth(), tb.getUTCDate(), hh - 4, mm); if (t <= now) t += 864e5; until = new Date(t).toISOString(); }
      const body = { on: true, reason: val('dp_r'), note: val('dp_n'), until };
      return run(async () => { const r = await api('POST', '/api/delivery/pause', body); S.A.dp = r.dpause; S.modal = null; toast(L('Доставка на паузе — на сайте объявление и только самовывоз', 'მიტანა შეჩერდა — საიტზე მხოლოდ გატანა')); }); }
    case 'dpOn': return run(async () => { await api('POST', '/api/delivery/pause', { on: false }); S.A.dp = null; toast(L('Доставка снова работает — на сайте уже видно', 'მიტანა ისევ მუშაობს')); });
    case 'cashMove': { const k = d.k; const K = { owner: L('Забрал владелец', 'მფლობელმა აიღო'), bank: L('Сдано в банк', 'ჩაბარდა ბანკში'), expense: L('Оплачено наличными (расход)', 'გადახდილია ნაღდით'), courier: L('Выдано курьеру на сдачу', 'კურიერს მიეცა'), in: L('Внесено в кассу (размен)', 'შეტანილია სალაროში') };
      S.modal = { type: 'form', data: { k }, html: () => `<h3>💵 ${K[k]}</h3><label class="l">${L('Сумма, ₾', 'თანხა, ₾')}<input class="f" id="cm_amt" inputmode="decimal" ${k === 'owner' || k === 'bank' ? `value="${(Math.max(0, S.A.cash.now.tetri) / 100).toFixed(2)}"` : ''}></label>
        <label class="l">${L('Комментарий', 'კომენტარი')}<input class="f" id="cm_note" placeholder="${k === 'bank' ? L('номер квитанции банка', 'ბანკის ქვითრის ნომერი') : k === 'expense' ? L('за что заплатили', 'რისთვის') : ''}"></label>
        <div class="note">${L('В кассе по программе', 'სალაროში პროგრამით')}: ${money(S.A.cash.now.tetri)}. ${L('Вам придёт сообщение в Telegram.', 'Telegram-ში მოგივათ შეტყობინება.')}</div>
        <div class="row"><button class="b bo" style="flex:1" data-a="mClose">${L('Отмена', 'გაუქმება')}</button><button class="b bd" style="flex:1" data-a="cashGo">${L('Записать', 'ჩაწერა')}</button></div>` }; return render(); }
    case 'cashGo': { const k = m.data.k; const amt = Math.round(Number(String(val('cm_amt')).replace(',', '.')) * 100); const note = val('cm_note');
      if (!(amt > 0)) return toast(L('Укажите сумму', 'მიუთითეთ თანხა'));
      return run(async () => { await api('POST', '/api/cash/move', { kind: k, amount_tetri: amt, note }); S.modal = null; S.A.cash = await api('GET', '/api/cash'); toast(L('Записано', 'ჩაიწერა')); }); }
    case 'cashConf': return run(async () => { await api('POST', '/api/cash/conf', { alert_tetri: Math.round(Number(val('ca_alert')) * 100), every_days: Number(val('ca_days')) }); S.A.cash = await api('GET', '/api/cash'); toast(L('Сохранено', 'შენახულია')); });
    case 'cpDone': { const id = Number(d.id); const note = prompt(L('Что сделали? (например: выдали пиццу, кассир Нино предупреждена)', 'რა გააკეთეთ?')) || ''; return run(async () => { await api('POST', `/api/complaints/${id}`, { status: 'done', note }); S.A.compl = await api('GET', '/api/complaints'); }); }
    case 'sndOn': ac(); S.needSound = false; ring('std'); return render();
    case 'kAck': S.kack.add(Number(d.id)); store.set('pr_kack', [...S.kack].slice(-200).join(',')); return render();
    case 'xlsx': return exportXlsx();
    case 'prt': return printAdmin();
    case 'schMonth': { const [y, mm] = S.A.smonth.split('-').map(Number); const dt = new Date(Date.UTC(y, mm - 1 + Number(d.k), 1)); S.A.smonth = dt.toISOString().slice(0, 7); return openAdmin('staff'); }
    case 'schCell': { const G = S.A.sched; const cur = (G.days[d.p] || {})[d.d] || ''; const order = ['', 'W', 'O', 'V', 'S']; const next = order[(order.indexOf(cur) + 1) % order.length];
      (G.days[d.p] ||= {}); if (next) G.days[d.p][d.d] = next; else delete G.days[d.p][d.d]; render();
      api('POST', '/api/schedule', { person_id: Number(d.p), date: d.d, code: next }).catch((e) => { toast(errText(e)); openAdmin('staff'); }); return; }
    case 'schDay': { const G = S.A.sched; const C = SCODE(); const by = (code) => G.people.filter((p) => (G.days[p.id] || {})[d.d] === code);
      S.modal = { type: 'form', html: () => `<h3>${d.d}</h3>${['W', 'V', 'S', 'O'].map((k) => { const L2 = by(k); return L2.length ? `<div><span class="pos-pill" style="background:${C[k][3]};color:${C[k][2]}">${C[k][1]} · ${L2.length}</span><div style="margin:6px 0 10px">${L2.map((p) => `<b>${esc(p.name)}</b> <span class="mut">${esc(p.position || '')}</span>`).join('<br>')}</div></div>` : ''; }).join('') || `<div class="mut">${L('На этот день ничего не отмечено', 'ამ დღეს არაფერია მონიშნული')}</div>`}<div class="row"><button class="b bd" style="flex:1" data-a="mClose">OK</button></div>` }; return render(); }
    case 'schFill': { const G = S.A.sched; const p = G.people.find((x) => x.id === Number(d.id));
      S.modal = { type: 'form', data: { id: p.id }, html: () => `<h3>${L('Шаблон графика', 'გრაფიკის შაბლონი')}: ${esc(p.name)}</h3>
        <label class="l">${L('Как работает', 'როგორ მუშაობს')}<select class="f" id="sf_p"><option value="5/2">${L('5/2 — пн–пт работает, сб–вс выходной', '5/2 — ორ–პარ მუშაობს, შაბ–კვ დასვენება')}</option><option value="2/2">${L('2/2 — два дня работает, два выходных', '2/2 — ორი დღე მუშაობს, ორი დასვენება')}</option><option value="1/1">${L('1/1 — через день', '1/1 — დღეგამოშვებით')}</option><option value="all">${L('каждый день', 'ყოველდღე')}</option><option value="vac">${L('отпуск', 'შვებულება')}</option><option value="clear">${L('очистить', 'გასუფთავება')}</option></select></label>
        <div class="g2"><label class="l">${L('С какого числа', 'რიცხვიდან')}<input class="f" id="sf_from" type="number" min="1" max="${G.days_in_month}" value="1"></label><label class="l">${L('По какое число', 'რიცხვამდე')}<input class="f" id="sf_to" type="number" min="1" max="${G.days_in_month}" value="${G.days_in_month}"></label></div>
        <div class="note">${L('Для 2/2 и 1/1 первый рабочий день — число «с какого». Отдельные дни потом можно поменять нажатием на клетку.', '2/2 და 1/1-ისთვის პირველი სამუშაო დღე — „რიცხვიდან“. ცალკეულ დღეებს მერე უჯრაზე დაჭერით შეცვლით.')}</div>
        <div class="row"><button class="b bo" style="flex:1" data-a="mClose">${L('Отмена', 'გაუქმება')}</button><button class="b bd" style="flex:1" data-a="schFillGo">${L('Заполнить', 'შევსება')}</button></div>` }; return render(); }
    case 'schFillGo': { const id = m.data.id; return run(async () => { await api('POST', '/api/schedule/fill', { person_id: id, month: S.A.sched.month, pattern: val('sf_p'), from: Number(val('sf_from')), to: Number(val('sf_to')) }); S.modal = null; await openAdmin('staff'); toast(L('График заполнен', 'გრაფიკი შეივსო')); }); }
    case 'stNew': S.modal = { type: 'form', html: () => `<h3>${L('Новый сотрудник', 'ახალი თანამშრომელი')}</h3><label class="l">${L('Имя', 'სახელი')}<input class="f" id="n_name"></label>
      <label class="l">${L('Роль', 'როლი')}<select class="f" id="n_role"><option value="cashier">${L('Кассир', 'მოლარე')}</option>${isOwner() ? `<option value="manager">${L('Администратор (менеджер)', 'ადმინისტრატორი (მენეჯერი)')}</option>` : ''}<option value="cook">${L('Повар', 'მზარეული')}</option></select></label>
      <label class="l">${L('Пароль (PIN, только цифры)', 'პაროლი (PIN, მხოლოდ ციფრები)')}<input class="f" id="n_pin" inputmode="numeric" maxlength="8" autocomplete="off"></label><div class="note">${L('Кассир — ровно 6 цифр, у каждого свой. Администратор и повар — 4–8 цифр. Не используйте 111111, 123456, дату рождения. Передайте пароль сотруднику лично.', 'მოლარე — ზუსტად 6 ციფრი, თითოეულს თავისი. ადმინისტრატორი და მზარეული — 4–8 ციფრი. პაროლი თანამშრომელს პირადად გადაეცით.')}</div><div class="row"><button class="b bo" style="flex:1" data-a="mClose">${L('Отмена', 'გაუქმება')}</button><button class="b bd" style="flex:1" data-a="stSave">${L('Создать', 'შექმნა')}</button></div>` }; return render();
    case 'stSave': { const body = { name: val('n_name').trim(), role: val('n_role'), pin: val('n_pin') }; if (body.name.length < 2) return toast(L('Введите имя', 'შეიყვანეთ სახელი')); return run(async () => { await api('POST', '/api/staff', body); S.modal = null; S.A.staff = await api('GET', '/api/staff'); toast(L('Сотрудник добавлен — передайте ему пароль', 'თანამშრომელი დაემატა')); }); }
    case 'stOn': { const id = Number(d.id); return run(async () => { await api('POST', `/api/staff/${id}/enable`); S.A.staff = await api('GET', '/api/staff'); toast(L('Доступ включён', 'წვდომა ჩაირთო')); }); }
    case 'stDel': { const id = Number(d.id); const x = (S.A.staff || []).find((y) => y.id === id); if (!armed(b) || !confirm(L('Удалить ' + (x ? x.name : '') + '? Доступ закроется навсегда.', 'წავშალოთ? წვდომა სამუდამოდ დაიხურება.'))) return; return run(async () => { await api('DELETE', `/api/staff/${id}`); S.A.staff = await api('GET', '/api/staff'); toast(L('Сотрудник удалён', 'თანამშრომელი წაიშალა')); }); }
    case 'stEdit': { const id = Number(d.id); const x = (S.A.staff || []).find((y) => y.id === id); if (!x) return; S.modal = { type: 'form', html: () => `<h3>${L('Сотрудник', 'თანამშრომელი')}</h3><label class="l">${L('Имя', 'სახელი')}<input class="f" id="e_name" value="${esc(x.name)}"></label>
      <label class="l">${L('Роль', 'როლი')}<select class="f" id="e_role">${(isOwner() ? ['owner', 'manager', 'cashier', 'cook'] : ['cashier', 'cook']).map((r) => `<option value="${r}" ${x.role === r ? 'selected' : ''}>${ROLE_N()[r]}</option>`).join('')}</select></label>
      <div class="row"><button class="b bo" style="flex:1" data-a="mClose">${L('Отмена', 'გაუქმება')}</button><button class="b bd" style="flex:1" data-a="stEditSave" data-id="${id}">${L('Сохранить', 'შენახვა')}</button></div>` }; return render(); }
    case 'stEditSave': { const id = Number(d.id); const body = { name: val('e_name').trim(), role: val('e_role') }; return run(async () => { await api('PUT', `/api/staff/${id}`, body); S.modal = null; S.A.staff = await api('GET', '/api/staff'); toast(L('Сохранено', 'შენახულია')); }); }
    case 'stPin': { const id = Number(d.id); S.modal = { type: 'form', html: () => `<h3>${L('Новый пароль (PIN)', 'ახალი პაროლი (PIN)')}</h3><input class="f" id="n_pin" inputmode="numeric" maxlength="8" autocomplete="off"><span class="mut" style="font-size:13px">${L('Кассир — ровно 6 цифр.', 'მოლარე — ზუსტად 6 ციფრი.')}</span><div class="row"><button class="b bo" style="flex:1" data-a="mClose">${L('Отмена', 'გაუქმება')}</button><button class="b bd" style="flex:1" data-a="stPinSave" data-id="${id}">${L('Сохранить', 'შენახვა')}</button></div>` }; return render(); }
    case 'stPinSave': { const id = Number(d.id); const pin = val('n_pin'); return run(async () => { await api('POST', `/api/staff/${id}/pin`, { pin }); S.modal = null; toast(L('PIN изменён', 'PIN შეიცვალა')); if (id === S.me.id) logout(true); }); }
    case 'stOff': { const id = Number(d.id); if (!confirm(L('Отключить сотрудника? Он сразу потеряет доступ. Включить обратно можно в любой момент.', 'გავთიშოთ თანამშრომელი? მას წვდომა მაშინვე შეეზღუდება.'))) return; return run(async () => { await api('POST', `/api/staff/${id}/disable`); S.A.staff = await api('GET', '/api/staff'); toast(L('Доступ отключён', 'წვდომა გაითიშა')); }); }
    case 'auVerify': return run(async () => { S.A.verify = await api('GET', '/api/audit/verify'); });
  }
});

/* старт */
if (/^#reset=[0-9a-f]{20,}$/.test(location.hash)) { const tk = location.hash.slice(7); S.token = null; S.me = null; S.view = 'login';
  S.modal = { type: 'form', data: { token: tk }, html: () => `<h3>🔑 ახალი PIN · Новый PIN владельца</h3><label class="l">ახალი PIN · Новый PIN (4–8)<input class="f" id="rs_new" type="password" inputmode="numeric" autocomplete="off"></label><label class="l">კიდევ ერთხელ · Ещё раз<input class="f" id="rs_new2" type="password" inputmode="numeric" autocomplete="off"></label><div class="row"><button class="b bd" style="flex:1" data-a="resetGo">შენახვა · Сохранить</button></div>` }; }
(async () => {
  if (S.token && S.me) { S.restore = true; await afterLogin(); }
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('/sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
